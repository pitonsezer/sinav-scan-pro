
name: Sinav Scan Pro - Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Kodlari indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutuphaneleri yukle
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Python kodunu kontrol et
        shell: pwsh
        run: |
          python -m py_compile sinav_scan_pro.py

      - name: EXE olustur - Hata ayiklama
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name SinavScanPro sinav_scan_pro.py

      - name: EXE dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: SinavScanPro-V3-Debug
          path: dist/SinavScanPro.exe
          if-no-files-found: error
